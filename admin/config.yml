backend:
  name: turbo-github
  turbo_site_id: 880bc932-c2d2-4e80-a87a-67e45e591442

publish_mode: simple
site_url: https://hi-jingjin.github.io
display_url: https://hi-jingjin.github.io/dance.html
media_folder: assets/dance/uploads
public_folder: /assets/dance/uploads

collections:
  - name: dance_posts
    label: Dance feed
    label_singular: Post
    folder: _dance_posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "dance/{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    editor:
      preview: true
      visualEditing: true
    fields:
      - { label: Post title, name: title, widget: string, hint: A short title for this update. }
      - label: Feed cover
        name: cover
        widget: image
        required: true
        hint: Used only as the thumbnail on the Dance feed. It will not appear inside the post.
        choose_url: false
        media_library:
          config:
            multiple: false
            max_file_size: 5242880
      - label: Post photos
        name: gallery
        widget: list
        required: false
        default: []
        max: 10
        hint: These photos appear only inside the post. Add up to 10 and drag items to change their order.
        field:
          label: Photo
          name: image
          widget: image
          choose_url: false
          media_library:
            config:
              multiple: false
              max_file_size: 5242880
      - { label: Caption, name: body, widget: markdown, hint: Write the story behind the photo or performance. }
      - { label: YouTube or social link, name: external_url, widget: string, required: false, hint: Paste a YouTube link to show its player on the single-post page. The feed will use your cover photo as its thumbnail. }
      - { label: Posted at, name: date, widget: datetime, default: "{{now}}" }
      - { label: Published, name: published, widget: hidden, default: true }
