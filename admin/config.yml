backend:
  name: turbo-github
  turbo_site_id: 880bc932-c2d2-4e80-a87a-67e45e591442

publish_mode: simple
site_url: https://hi-jingjin.github.io
display_url: https://hi-jingjin.github.io/dance.html
media_folder: assets/dance/uploads
public_folder: /assets/dance/uploads

collections:
  - name: dance_posts
    label: Dance posts
    label_singular: Dance post
    folder: _dance_posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "dance/{{slug}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: Published, field: published, pattern: true }
      - { label: Drafts, field: published, pattern: false }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime }
      - { label: Published, name: published, widget: boolean, default: true }
      - { label: Summary, name: summary, widget: text }
      - label: Cover image
        name: cover
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            multiple: false
            max_file_size: 5242880
      - { label: Cover image description, name: cover_alt, widget: string, required: false, hint: Describe the image for accessibility. }
      - { label: Video or social link, name: external_url, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
