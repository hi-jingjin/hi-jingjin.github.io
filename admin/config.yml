backend:
  name: turbo-github
  turbo_site_id: 880bc932-c2d2-4e80-a87a-67e45e591442

publish_mode: simple
site_url: https://hi-jingjin.github.io
display_url: https://hi-jingjin.github.io/dance.html
media_folder: assets/dance/uploads
public_folder: /assets/dance/uploads

collections:
  - name: dance_posts
    label: Dance feed
    label_singular: Post
    folder: _dance_posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "dance/{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    editor:
      preview: true
      visualEditing: true
    fields:
      - { label: Post title, name: title, widget: string, hint: A short title for this update. }
      - label: Photo
        name: cover
        widget: image
        required: false
        hint: Upload one photo, just like starting an Instagram post.
        choose_url: false
        media_library:
          config:
            multiple: false
            max_file_size: 5242880
      - { label: Caption, name: body, widget: markdown, hint: Write the story behind the photo or performance. }
      - { label: YouTube or social link, name: external_url, widget: string, required: false, hint: Paste a YouTube link to show the video player directly in your post. Instagram and other links will remain clickable. }
      - { label: Posted at, name: date, widget: datetime, default: "{{now}}" }
      - { label: Published, name: published, widget: hidden, default: true }
